name: Build Android app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax check
        run: for f in www/js/*.js admin/js/*.js; do node --check "$f"; done
      - name: No secrets or private keys in the bundle
        run: |
          ! grep -rIlE "BEGIN (RSA |EC )?PRIVATE KEY|\"type\": *\"service_account\"" www admin android || (echo "Private key material found" && exit 1)

  android:
    needs: web-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Gradle wrapper is the official one
        uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "VX_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Build (signed release when secrets exist, otherwise debug)
        env:
          VX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            cd android && ./gradlew lintRelease assembleRelease bundleRelease
          else
            cd android && ./gradlew lintDebug assembleDebug
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: vastrenix-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30
